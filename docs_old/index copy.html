<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>東京医療減災Labo - GitHub Repository</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 60px;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            font-size: 2em;
            color: #2a5298;
            margin-bottom: 20px;
            font-weight: 300;
        }
        
        .saigai-red {
            color: #dc143c;
            font-weight: bold;
        }
        
        p {
            font-size: 1.1em;
            color: #666;
            margin: 20px 0;
            line-height: 1.8;
        }
        
        .button {
            display: inline-block;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 20px 40px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2em;
            margin: 30px 10px 10px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(42, 82, 152, 0.3);
        }
        
        .button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(42, 82, 152, 0.5);
        }
        
        .secondary {
            background: white;
            color: #2a5298;
            border: 2px solid #2a5298;
            padding: 15px 30px;
            font-size: 1em;
        }
        
        .secondary:hover {
            background: #f0f0f0;
        }
        
        .info {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #e0e0e0;
            font-size: 0.9em;
            color: #999;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 40px 30px;
            }
            
            h1 {
                font-size: 1.5em;
            }
            
            .button {
                display: block;
                margin: 15px 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>東京医療減<span class="saigai-red">災</span>Labo</h1>
        <h2 style="font-size: 1.3em; color: #666; font-weight: 300; margin-bottom: 30px;">
            実践知の体系
        </h2>
        
        <p>
            20年の実践から生まれた<br>
            災害対応力向上の完全体系
        </p>
        
        <a href="docs/index.html" class="button">
            📚 資料を見る
        </a>
        
        <br>
        
        <a href="https://github.com/[ユーザー名]/[リポジトリ名]" class="button secondary">
            💻 GitHubリポジトリ
        </a>
        
        <div class="info">
            <p style="margin: 10px 0;">
                理念・実践・戦略の3つの視点から<br>
                医療機関の災害対応力を体系的に解説
            </p>
            <p style="margin-top: 20px;">
                ©HDMG2004 2025 | CC BY-NC-SA 4.0
            </p>
        </div>
    </div>
    
    <script>
        // GitHub Pagesで公開されている場合は自動的にdocs/に転送
        if (window.location.hostname.includes('github.io')) {
            window.location.replace('docs/index.html');
        }
    </script>
</body>
</html>
